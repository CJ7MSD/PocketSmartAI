{% extends "base.html" %}{% block title %}Jewelry Planner | PocketSmart AI{% endblock %}{% block content %}<div class="planner-head"><div><h1>💎 Jewelry Budget Planner</h1><p>Match occasion and style with your planned spending.</p></div><a class="btn secondary" href="/">← Back</a></div><div class="layout"><form id="jewelry-form" class="form" enctype="multipart/form-data"><h2>Style details</h2><label>Budget (₹)<input name="budget" type="number" min="1" placeholder="10000" required></label><label>Occasion<input name="occasion" placeholder="Wedding" required></label><label>Style<select name="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Festive</option><option>Casual</option></select></label><label>Outfit description<textarea name="outfit_description" placeholder="Color, fabric, neckline or other useful details..."></textarea></label><label class="upload">Optional outfit image<input name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">JPG, PNG or WEBP. Maximum 8 MB.</div></label><button class="btn" type="submit">Generate jewelry plan →</button></form><section class="result-shell"><div id="result" class="empty">Your jewelry recommendation will appear here.</div></section></div>{% endblock %}
